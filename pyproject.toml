[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "refreshsizer"
version = "1.0.0"
description = "Performance-normalized x86 server refresh sizing (Dell PowerEdge 17G) from legacy x86/RISC estates"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }
dependencies = [
  "pydantic>=2.6",
  "pandas>=2.1",
  "openpyxl>=3.1",
  "xlrd>=2.0",
  "odfpy>=1.4",
  "rapidfuzz>=3.5",
  "httpx>=0.27",
  "beautifulsoup4>=4.12",
  "PyYAML>=6.0",
  "Jinja2>=3.1",
  "matplotlib>=3.8",
  "XlsxWriter>=3.1",
  "typer>=0.12",
  "rich>=13.7",
  "numpy>=1.26",
  "xhtml2pdf>=0.2.11",
  "fastapi>=0.110",
  "uvicorn>=0.29",
  "python-multipart>=0.0.9",
]

[project.optional-dependencies]
llm = ["anthropic>=0.40"]
dev = ["pytest>=8", "hypothesis>=6.100", "ruff>=0.5", "mypy>=1.10", "types-PyYAML"]

[project.scripts]
refreshsizer = "refreshsizer.cli:main"

[tool.setuptools.packages.find]
include = ["refreshsizer*"]

[tool.setuptools.package-data]
refreshsizer = ["**/*.yaml", "report/templates/*.j2", "report/templates/*.css", "ui/templates/*.html",
                "ui/static/*", "ui/static/vendor/*"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E501", "B008"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
warn_unused_ignores = false
check_untyped_defs = true
no_implicit_optional = true
plugins = ["pydantic.mypy"]
exclude = ["tests/fixtures/"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
