# RefreshSizer default sizing policy. Override with the Policy sheet, --policy policy.yaml or CLI flags.
benchmark_metric: by_class   # cpu2017_int_rate_base | cpu2026_int_rate_base | by_class
class_metric_map: {general_virt: cpu2017_int_base, oltp_db: cpu2017_int_base, sap_app: saps,
  java_web: specjbb2015_maxjops, hpc: cpu2017_fp_base, dwh: cpu2017_fp_base, vdi: cpu2017_int_base,
  containers: cpu2017_int_base, ms_apps: cpu2017_int_base}   # fallback always cpu2017_int_base
growth: {cpu_pct: 15, mem_pct: 10, storage_pct: 20, iops_pct: 15}
growth_events: []            # list of {year: 2, su: 100, mem_gib: 512, storage_tib: 20}
horizon_years: 5
u_max: {general_virt: 0.75, vdi: 0.65, oltp_db: 0.70, hpc: 0.80, batch: 0.80, containers: 0.75, default: 0.75}
ha_policy: auto          # auto (N+1, N+2 above 16 hosts) | N+0 | N+1 | N+2
ha_n2_threshold_hosts: 16
maintenance_reserve: false
max_cluster_size: 64
max_hosts_per_cluster_user: null   # e.g. 3 -> switches vSAN RAID-5 4+1 to 2+1
stretched_cluster: false
vcpu_ratio_max: {tier0: 4, tier1: 6, general: 8, dev: 10}
numa_nps: 1
memory_basis: configured   # configured | consumed | active | overcommit
memory_overcommit_ratio: 1.25
active_memory_factor: 1.25
hypervisor_mem_overhead: 0.05
mem_free_reserve: 0.05
mem_bw_min_gbs_per_core: 4.0
drr: {oltp_db: 1.0, general_virt: 1.5, vdi: 3.0, default: 1.3}
storage_architecture: auto   # auto | vsan_esa | external
protection: vsan_esa_raid5_4p1   # vsan_esa_raid1 | vsan_esa_raid5_4p1 | vsan_esa_raid5_2p1 | vsan_esa_raid6_4p2
slack: 0.30
min_drives_per_host: 4
vsan_cpu_reserve_high_io: 0.10
vsan_high_io_threshold_iops_per_host: 100000
write_penalty: {vsan_esa_raid1: 2, vsan_esa_raid5_4p1: 2, vsan_esa_raid5_2p1: 2, vsan_esa_raid6_4p2: 3, external: 1}
iops_profile_per_class: {general_virt: 50, oltp_db: 2000, vdi: 20, ms_apps: 100, default: 50}
percentile: 95
percentile_method: nearest_rank
p95_estimate: false          # Live Optics: p95 ~= avg + 0.8 * (peak - avg)
p95_estimate_factor: 0.8
rvtools_burst_factor: 1.4
vm_peak_coincidence: 0.7
saturation_threshold: 0.80
saturation_uplift: 1.10
inventory_assumed_util: 1.00
inventory_vcpu_ratio_assumed: 1.0
inventory_apply_headroom: true
k_arch: {x86: 1.0, risc_oltp_db: 1.25, risc_sap_app: 1.15, risc_other: 1.10}
k_arch_range: {low: 1.10, high: 1.25}
k_virt_baremetal_to_virtual: 1.07
rperf_to_spec_default: 0.425
rperf_factor_mode: conservative   # conservative (always rperf_to_spec_default) | generation_matched
target_virtualized: true
oracle_db_cluster_licensing: active_nodes   # active_nodes (failover 10-day rule) | all_nodes
vmware_edition: vcf      # vcf | vvf | none
vmware_min_cores_per_cpu: 16
vmware_order_min_cores: 0
network_vmotion_mbps: 1250
network_replication_mbps: 0
split_clusters: auto
prefer_measured_spec: true   # rank configs backed by a published SPEC result (same CPU & socket count) first
objective: min_tco      # min_tco | min_hosts | min_licensed_cores | min_power | max_headroom
top_n: 5
rack_unit_budget: null
power_budget_w: null
target_platforms: null   # e.g. [R7725, R770] to restrict the optimizer (null = every Dell 17G platform)
target_cpu_vendors: null # e.g. [Intel] or [AMD] (null = both)
target_cpus: null        # e.g. [amd-epyc-9355, intel-xeon-6787p] (null = every supported CPU)
cpu_scenarios_max: 15    # CPU scenarios shown per cluster (best configuration per CPU model)
monte_carlo_runs: 5000
monte_carlo_seed: 42
llm_enabled: auto
llm_model: claude-sonnet-5-5
mapping_autoaccept: 0.9
mapping_yes_threshold: 0.6
mapping_strict_threshold: 0.9
exclude_templates: true
exclude_powered_off: true
report_lang: en
