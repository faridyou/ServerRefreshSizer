ui_p2v_title: {en: "P2V: pCore to vCore ratio (physical servers)", fr: "P2V : ratio cœur physique / cœur virtuel (serveurs physiques)"}
ui_p2v_intro: {en: "For physical servers WITHOUT measured usage, each one is sized at its capacity (SPEC Score of its CPUs x cores) divided by its ratio: 3 : 1 means three of today's physical cores run on one performance-equivalent new core. The most specific value wins: server > pattern > cluster > global. Servers with measured usage (utilization, physc_p95) are listed as not used: measured data always takes precedence.", fr: "Pour les serveurs physiques SANS usage mesuré, chacun est dimensionné à sa capacité (Score SPEC de ses processeurs x cœurs) divisée par son ratio : 3 : 1 signifie que trois cœurs physiques actuels tournent sur un cœur neuf de performance équivalente. La valeur la plus précise s'applique : serveur > motif > cluster > global. Les serveurs avec usage mesuré (utilisation, physc_p95) sont indiqués « non utilisé » : les données mesurées priment toujours."}
